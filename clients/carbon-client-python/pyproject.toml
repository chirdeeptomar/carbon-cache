[project]
name = "carbon-client-python"
version = "0.1.0"
description = "Python client for Carbon distributed cache"
readme = "README.md"
authors = [
    { name = "Chirdeep Tomar", email = "chirdeep.tomar@gmail.com" }
]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/chirdeep/carbon"
Repository = "https://github.com/chirdeep/carbon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbon_cache"]
