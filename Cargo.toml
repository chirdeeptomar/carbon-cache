[workspace]
resolver = "2"
members = [
    "server-http",
    "server-tcp",
    "storage-engine",
    "shared",
    "carbon",
    "carbon-server",
    "shared-http",
    "carbon-raft",
]

[workspace.dependencies]
# Async runtime and utilities
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
async-trait = "0.1.91"
futures = "0.3.33"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_bytes = "0.11"

# Web frameworks
axum = "0.8.9"
tower-http = { version = "0.7.0", features = [
    "trace",
    "cors",
    "normalize-path",
] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Data structures and utilities
bytes = "1.12.1"
dashmap = "6.2.1"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde", "js"] }

# Caching
moka = { version = "0.12.15", features = ["future"] }
foyer = "0.22.3"

# Storage
redb = "4.1.0"

# Distributed consensus
openraft = { version = "0.9", features = ["serde"] }

# Error handling
thiserror = "2.0.19"

# Security
argon2 = { version = "0.5", features = ["std"] }

# Random number generation
rand = "0.10.2"
rand_core = "0.10.1"

# HTTP client (for leader-forwarding in cluster mode)
reqwest = { version = "0.13.4", features = ["json"] }

# Configuration
dotenvy = "0.15"

# Development and profiling
dhat = "0.3.3"
tempfile = "3.27.0"

# Workspace members
carbon = { path = "carbon" }
carbon-raft = { path = "carbon-raft" }
carbon-server = { path = "carbon-server" }
shared = { path = "shared" }
shared-http = { path = "shared-http" }
storage-engine = { path = "storage-engine" }
server-http = { path = "server-http" }
server-tcp = { path = "server-tcp" }

[profile.release]
debug = true # Keep debug symbols for profiling
