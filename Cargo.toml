[workspace]
resolver = "2"
members = [
    "server-http",
    "server-tcp",
    "storage-engine",
    "shared",
    "carbon",
    "carbon-server",
    "carbon-admin-ui",
    "shared-http",
]

[workspace.dependencies]
# Async runtime and utilities
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
async-trait = "0.1.68"
futures = "0.3.32"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
serde_bytes = "0.11"

# Web frameworks
axum = "0.8.9"
tower-http = { version = "0.6", features = ["trace", "cors", "normalize-path"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Data structures and utilities
bytes = "1.11.1"
dashmap = "6.2.1"
base64 = "0.22"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.2", features = ["v4", "serde", "js"] }

# Caching
moka = { version = "0.12.15", features = ["future"] }
foyer = "0.22.3"

# Storage
sled = "0.34"

# Error handling
thiserror = "2.0.18"

# Security
argon2 = { version = "0.5", features = ["std"] }

# Random number generation
rand = "0.10.1"
rand_core = "0.10.1"

# Configuration
dotenvy = "0.15"

# Development and profiling
dhat = "0.3.3"
tempfile = "3.27.0"

# Workspace members
carbon = { path = "carbon" }
carbon-server = { path = "carbon-server" }
carbon-admin-ui = { path = "carbon-admin-ui" }
shared = { path = "shared" }
shared-http = { path = "shared-http" }
storage-engine = { path = "storage-engine" }
server-http = { path = "server-http" }
server-tcp = { path = "server-tcp" }

[profile.release]
debug = true # Keep debug symbols for profiling
